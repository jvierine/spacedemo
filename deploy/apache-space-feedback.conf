# Add inside the juha.no TLS VirtualHost.
ProxyPass        /space/api/ http://127.0.0.1:8789/ connectiontimeout=3 timeout=10
ProxyPassReverse /space/api/ http://127.0.0.1:8789/

<Location "/space/api/">
    LimitRequestBody 8192
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
</Location>
